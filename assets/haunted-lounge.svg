<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1050" role="img" aria-labelledby="title desc">
<title id="title">The haunted 420 gaming lounge</title>
<desc id="desc">An old enchanted gaming room with a glowing green CRT, a friendly phantom, twisted branches, a controller, and spooky teal smoke.</desc>
<defs>
<radialGradient id="moon"><stop stop-color="#efffcc"/><stop offset=".4" stop-color="#b2e2ba"/><stop offset="1" stop-color="#81e8ac" stop-opacity="0"/></radialGradient>
<radialGradient id="fog"><stop stop-color="#6decbd" stop-opacity=".55"/><stop offset=".5" stop-color="#3c9f7e" stop-opacity=".28"/><stop offset="1" stop-color="#24573f" stop-opacity="0"/></radialGradient>
<linearGradient id="wall" x1=".1" y1=".1" x2=".8" y2="1"><stop stop-color="#234b42"/><stop offset=".5" stop-color="#0d2926"/><stop offset="1" stop-color="#061715"/></linearGradient>
<linearGradient id="window" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#406b62"/><stop offset=".6" stop-color="#122c2c"/><stop offset="1" stop-color="#071b1b"/></linearGradient>
<linearGradient id="tv" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#50745a"/><stop offset=".25" stop-color="#253d37"/><stop offset=".8" stop-color="#0d1c1d"/><stop offset="1" stop-color="#4f6949"/></linearGradient>
<radialGradient id="crt"><stop stop-color="#7bffa5" stop-opacity=".48"/><stop offset=".65" stop-color="#176455" stop-opacity=".64"/><stop offset="1" stop-color="#071b22"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c2e3a0"/><stop offset=".5" stop-color="#618c73"/><stop offset="1" stop-color="#183f3a"/></linearGradient>
<linearGradient id="ghost" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f1ffe0"/><stop offset=".48" stop-color="#a9f4c6"/><stop offset="1" stop-color="#1ba18c" stop-opacity=".35"/></linearGradient>
<radialGradient id="eye"><stop stop-color="#f3ffbb"/><stop offset="1" stop-color="#c4ff73"/></radialGradient>
<filter id="aura" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="18" flood-color="#020e0d" flood-opacity=".75"/></filter>
<pattern id="scan" width="4" height="8" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#d3ffe7" opacity=".06"/></pattern>
<pattern id="grain" width="93" height="81" patternUnits="userSpaceOnUse"><path d="M5 11h1M52 31h2M25 70h1M82 76h1M43 6h1" stroke="#d7ffbc" stroke-opacity=".22"/></pattern>
</defs>
