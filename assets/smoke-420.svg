<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -32 452 218" role="img" aria-labelledby="title desc">
<title id="title">420 in smoky lettering</title>
<desc id="desc">The digits 420 rendered as smoky lettering. No background haze or cloud.</desc>
<defs>
 <linearGradient id="vapor" x1="0" y1="1" x2="0" y2="0">
  <stop stop-color="#d7e2d4" stop-opacity="1"/>
  <stop offset=".5" stop-color="#f2f6ee" stop-opacity="1"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
 </linearGradient>
 <filter id="smoke-edge" x="-20%" y="-20%" width="140%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="3" seed="24" result="grain"/>
  <feDisplacementMap in="SourceGraphic" in2="grain" scale="10" xChannelSelector="R" yChannelSelector="G" result="smoked"/>
  <feGaussianBlur in="smoked" stdDeviation="1.1"/>
 </filter>
</defs>
<!-- Smoky lettering only: crisp digit forms with smoke-textured edges. No haze, no cloud, no background. -->
<g font-family="Arial Black,Impact,sans-serif" font-size="148" font-weight="900" letter-spacing="-10">
 <text x="23" y="129" fill="url(#vapor)" filter="url(#smoke-edge)">420</text>
</g>
</svg>
