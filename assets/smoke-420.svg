<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -32 452 218" role="img" aria-labelledby="title desc">
<title id="title">420 made of pale green swirling smoke</title>
<desc id="desc">The digits 420 rendered as smoky lettering, with soft translucent haze and wispy edges.</desc>
<defs>
 <linearGradient id="vapor" x1="0" y1="1" x2="0" y2="0">
  <stop stop-color="#b8ecb8" stop-opacity=".75"/>
  <stop offset=".45" stop-color="#e8ffe2" stop-opacity=".95"/>
  <stop offset="1" stop-color="#f8fff9" stop-opacity=".71"/>
 </linearGradient>
 <filter id="smoke-edge" x="-35%" y="-60%" width="170%" height="220%">
  <feTurbulence type="fractalNoise" baseFrequency=".045 .092" numOctaves="3" seed="24" result="grain"/>
  <feDisplacementMap in="SourceGraphic" in2="grain" scale="16" xChannelSelector="R" yChannelSelector="G" result="smoked"/>
  <feGaussianBlur in="smoked" stdDeviation="1.7"/>
 </filter>
 <filter id="smoke-haze" x="-40%" y="-70%" width="180%" height="240%">
  <feGaussianBlur stdDeviation="8"/>
 </filter>
 <filter id="smoke-wisp" x="-40%" y="-90%" width="180%" height="280%">
  <feTurbulence type="fractalNoise" baseFrequency=".019 .043" numOctaves="3" seed="17" result="draft"/>
  <feDisplacementMap in="SourceGraphic" in2="draft" scale="23" xChannelSelector="R" yChannelSelector="G"/>
  <feGaussianBlur stdDeviation="3.7"/>
 </filter>
</defs>
<!-- The digits 420 rendered as smoky lettering, not a hard outline or background cloud. -->
<g font-family="Arial Black,Impact,sans-serif" font-size="148" font-weight="900" letter-spacing="-10">
 <text x="23" y="129" fill="#bfeaba" opacity=".52" filter="url(#smoke-haze)">420</text>
 <text x="23" y="129" fill="#e1f8df" opacity=".24" filter="url(#smoke-wisp)">420</text>
 <text x="23" y="129" fill="url(#vapor)" filter="url(#smoke-edge)">420</text>
</g>
<g fill="none" stroke="#d8f5d6" stroke-linecap="round" filter="url(#smoke-wisp)">
 <path d="M15 99C-3 65 66 48 40 21S78-18 64-29M99 116C148 77 88 52 135 15S162-14 150-30M194 126C151 88 236 73 191 42S251-12 232-30" stroke-width="14" opacity=".49"/>
 <path d="M266 119C307 78 247 50 298 21S326-19 334-30M353 125C389 93 338 69 394 33S411-5 427-27" stroke-width="11" opacity=".37"/>
 <path d="M18 131C-7 153 44 173 23 190M107 132C79 165 129 178 116 196M310 131C292 158 335 168 320 193" stroke-width="10" opacity=".33"/>
</g>
</svg>