<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 245 116" role="img" aria-labelledby="title">
<title id="title">Smoke-formed 420 lettering</title>
<defs><linearGradient id="vapor" x1="0" x2="0" y1="1" y2="0"><stop stop-color="#a4d895"/><stop offset=".48" stop-color="#e9f7e1"/><stop offset="1" stop-color="#d0f4cc"/></linearGradient><mask id="photographic-smoke"><image width="120" height="85" href="data:image/png;base64,"/></mask></defs>
<defs>
  <linearGradient id="complete-420" x1="0" x2=".3" y1="1" y2="0"><stop stop-color="#c6f0b9"/><stop offset=".45" stop-color="#f4fff0"/><stop offset="1" stop-color="#b7e8b4"/></linearGradient>
  <filter id="complete-420-haze" x="-15%" y="-25%" width="130%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence baseFrequency=".028 .09" numOctaves="3" seed="7" result="vapor"/>
    <feDisplacementMap in="SourceGraphic" in2="vapor" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation=".55"/>
  </filter>
  <filter id="complete-420-glow" x="-25%" y="-40%" width="150%" height="180%">
    <feGaussianBlur stdDeviation="4.2"/>
  </filter>
  <g id="complete-numerals">
    <path id="smoke-four" transform="translate(5 103) scale(.061 -.061)" d="M679 1176 299 551H679ZM621 1493H1006V551H1198V272H1006V0H679V272H83V602Z"/>
    <path id="smoke-two" transform="translate(84 103) scale(.061 -.061)" d="M531 283H1122V0H146V283L636 764Q702 830 733.5 893.0Q765 956 765 1024Q765 1129 701.5 1193.0Q638 1257 533 1257Q452 1257 355.5 1218.5Q259 1180 149 1104V1432Q266 1475 380.5 1497.5Q495 1520 605 1520Q846 1520 979.5 1402.0Q1113 1284 1113 1073Q1113 951 1056.5 845.5Q1000 740 818 563Z"/>
    <path id="smoke-zero" transform="translate(161 103) scale(.061 -.061)" fill-rule="evenodd" d="M848 748Q848 1028 800.5 1142.5Q753 1257 642 1257Q530 1257 482.5 1142.5Q435 1028 435 748Q435 465 482.5 349.0Q530 233 642 233Q752 233 800.0 349.0Q848 465 848 748ZM1194 745Q1194 374 1050.0 172.5Q906 -29 642 -29Q376 -29 232.0 172.5Q88 374 88 745Q88 1117 232.0 1318.5Q376 1520 642 1520Q906 1520 1050.0 1318.5Q1194 1117 1194 745Z"/>
  </g>
</defs>
<!-- The original approved photographic smoke remains as organic wisps.
     It cannot be relied upon as the digit silhouette: the source is just 120x85. -->
<g transform="translate(7 3) scale(1.92 1.27)" opacity=".66">
  <rect width="120" height="85" fill="url(#vapor)" mask="url(#photographic-smoke)"/>
</g>
<!-- Three complete high-resolution vector glyphs preserve the 0 opening and outline.
     Natural wisps and filtered outlines blend with the original approved smoke. -->
<use href="#complete-numerals" fill="#97df9c" opacity=".48" filter="url(#complete-420-glow)"/>
<use href="#complete-numerals" fill="url(#complete-420)" opacity=".82" filter="url(#complete-420-haze)"/>

</svg>