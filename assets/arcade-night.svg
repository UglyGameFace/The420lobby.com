    <linearGradient id="side" x1="786" y1="125" x2="915" y2="617" gradientUnits="userSpaceOnUse"><stop stop-color="#a875ff"/><stop offset=".45" stop-color="#63418a"/><stop offset="1" stop-color="#2a233c"/></linearGradient>
    <linearGradient id="screen" x1="497" y1="228" x2="728" y2="427" gradientUnits="userSpaceOnUse"><stop stop-color="#172d23"/><stop offset="1" stop-color="#0a1713"/></linearGradient>
    <linearGradient id="glass" x1="186" y1="282" x2="349" y2="606" gradientUnits="userSpaceOnUse"><stop stop-color="#caffdf" stop-opacity=".25"/><stop offset=".34" stop-color="#63a7a0" stop-opacity=".08"/><stop offset=".7" stop-color="#8cffb5" stop-opacity=".23"/><stop offset="1" stop-color="#305559" stop-opacity=".6"/></linearGradient>
