    <radialGradient id="halo"><stop stop-color="#7445af" stop-opacity=".25"/><stop offset="1" stop-color="#7445af" stop-opacity="0"/></radialGradient>
    <radialGradient id="limehalo"><stop stop-color="#b4ff5a" stop-opacity=".09"/><stop offset="1" stop-color="#b4ff5a" stop-opacity="0"/></radialGradient>
