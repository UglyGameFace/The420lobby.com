<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The 420 Lobby neon arcade</title>
  <desc id="desc">An illustrated violet arcade cabinet with a glowing green 420 screen, surrounded by botanical leaves, a glass water pipe, a grinder, rolling papers, and a lime lighter.</desc>
