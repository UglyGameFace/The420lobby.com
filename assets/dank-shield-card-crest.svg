<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title desc">
<title id="title">Dank Shield crest</title>
<desc id="desc">Dark steel security crest with a vivid green seven-point cannabis emblem, locked crown, metallic DANK SHIELD wordmark, and luminous green circuit halo</desc>
<defs>
 <linearGradient id="steel" x1=".08" y1=".1" x2=".91" y2=".94" gradientUnits="objectBoundingBox"><stop stop-color="#d6e6da"/><stop offset=".15" stop-color="#223a30"/><stop offset=".47" stop-color="#7f9185"/><stop offset=".58" stop-color="#101b19"/><stop offset=".89" stop-color="#596960"/><stop offset="1" stop-color="#0c1412"/></linearGradient>
 <linearGradient id="inner" x1=".1" y1="0" x2=".8" y2="1"><stop stop-color="#25482f"/><stop offset=".38" stop-color="#081610"/><stop offset=".82" stop-color="#142b1f"/><stop offset="1" stop-color="#050a09"/></linearGradient>
 <linearGradient id="leaf" x1=".1" y1="0" x2=".82" y2=".9"><stop stop-color="#efffac"/><stop offset=".22" stop-color="#a7ff32"/><stop offset=".49" stop-color="#32d900"/><stop offset=".73" stop-color="#187a28"/><stop offset="1" stop-color="#a7fa4d"/></linearGradient>
 <linearGradient id="metaltype" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffef0"/><stop offset=".18" stop-color="#bfcfc1"/><stop offset=".44" stop-color="#f5fff4"/><stop offset=".49" stop-color="#566e5d"/><stop offset="1" stop-color="#e1ebdf"/></linearGradient>
 <linearGradient id="plaque" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#253e2d"/><stop offset=".22" stop-color="#9bc18e"/><stop offset=".3" stop-color="#111c1b"/><stop offset=".88" stop-color="#0a1110"/><stop offset="1" stop-color="#859c87"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#64ff26" stop-opacity=".3"/><stop offset=".55" stop-color="#36cf2e" stop-opacity=".08"/><stop offset="1" stop-color="#20c02f" stop-opacity="0"/></radialGradient>
 <filter id="bloom" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="7"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="175%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".6"/></filter>
 <g id="blade"><path d="M317 303 C290 268 274 230 303 174 Q317 147 320 120 Q325 164 338 185 C349 222 332 267 317 303Z" stroke="#c7ff8a" stroke-width="2.4" stroke-linejoin="round"/><path d="M319 298Q320 219 320 144" fill="none" stroke="#f5ffd1" stroke-width="2" opacity=".78"/><path d="M320 234l-14-19m14 47 15-25m-16-47 11-18" stroke="#f6ffb9" stroke-width="1.8" opacity=".52" fill="none"/></g>
 <g id="sideblade"><path d="M320 303 C279 278 249 257 231 226 L229 208 L215 199 L223 184 L212 172 L228 158 L224 143 L245 149 C269 158 291 195 320 303Z" stroke="#b8ff72" stroke-width="2" stroke-linejoin="round"/><path d="M314 293 237 171m50 81-22-9m39 27-20-6" stroke="#efffbd" stroke-width="1.5" opacity=".65" fill="none"/></g>
 <g id="lowerblade"><path d="M318 309 C286 297 263 295 244 300 L225 286 L214 300 L196 293 L194 313 L178 318 L199 333 L202 350 L224 345 Q263 352 318 315Z" stroke="#b3ef69" stroke-width="2" stroke-linejoin="round"/><path d="M310 315 202 324m69-9-16 16" stroke="#f0ffca" stroke-width="1.5" fill="none" opacity=".65"/></g>
</defs>
<ellipse cx="320" cy="285" rx="290" ry="286" fill="url(#halo)"/>
<g fill="none" stroke="#87ff39" opacity=".36">
 <circle cx="320" cy="269" r="247" stroke-width="2"/><circle cx="320" cy="269" r="260" stroke-width=".8" stroke-dasharray="3 13"/>
 <path d="M75 259H121l30-38M565 259H519l-30-38M107 124h68l33 28M533 124h-68l-33 28M96 424h80l22-22M544 424h-80l-22-22"/>
</g>
<g fill="#afff73"><circle cx="121" cy="259" r="3"/><circle cx="519" cy="259" r="3"/><circle cx="175" cy="124" r="3"/><circle cx="465" cy="124" r="3"/><circle cx="176" cy="424" r="3"/><circle cx="464" cy="424" r="3"/></g>
<g filter="url(#shadow)">
 <path d="M320 38 495 115 487 315 Q475 393 320 462 Q165 393 153 315L145 115Z" fill="#050b09" stroke="url(#steel)" stroke-width="21" stroke-linejoin="round"/>
 <path d="M320 67 468 132 459 307 Q445 373 320 435 Q195 373 181 307L172 132Z" fill="url(#inner)" stroke="#57ff35" stroke-width="8" stroke-linejoin="round"/>
 <path d="M320 90 447 147 441 306Q427 358 320 412Q213 358 199 306L193 147Z" fill="none" stroke="#bbff91" stroke-width="2.6" opacity=".65"/>
 <path d="M151 148 320 70 489 148" fill="none" stroke="#eefff0" stroke-opacity=".5" stroke-width="3"/>
 <path d="M218 370Q320 443 420 370" fill="none" stroke="#7bff32" stroke-opacity=".37" stroke-width="5"/>
</g>
<!-- Crown padlock, seated inside the top of the shield. -->
<g filter="url(#shadow)">
 <path d="M281 142v-33Q281 67 320 67t39 42v33" fill="none" stroke="#0a1710" stroke-width="26"/>
 <path d="M281 142v-33Q281 67 320 67t39 42v33" fill="none" stroke="url(#steel)" stroke-width="18"/>
 <path d="M294 142v-33q0-27 26-27t26 27v33" fill="none" stroke="#a3ff46" stroke-width="6"/>
 <rect x="270" y="124" width="100" height="61" rx="8" fill="url(#steel)" stroke="#89ff2e" stroke-width="5"/>
 <rect x="283" y="135" width="74" height="39" rx="3" fill="#092013"/>
 <path d="M320 142v18" stroke="#b6ff4e" stroke-width="6" stroke-linecap="round"/>
</g>
<!-- Seven distinct serrated leaflets. Central stalk is continuous and anatomical. -->
<g fill="url(#leaf)" filter="url(#shadow)">
 <use href="#blade"/>
 <use href="#sideblade"/>
 <use href="#sideblade" transform="translate(640 0) scale(-1 1)"/>
 <use href="#lowerblade"/>
 <use href="#lowerblade" transform="translate(640 0) scale(-1 1)"/>
 <path d="M316 321 C280 321 247 327 218 359L203 354L207 374L185 384L208 391L214 409Q255 398 316 328Z" stroke="#b7ff77" stroke-width="2"/>
 <path d="M324 321 C360 321 393 327 422 359L437 354L433 374L455 384L432 391L426 409Q385 398 324 328Z" stroke="#b7ff77" stroke-width="2"/>
 <path d="M320 285Q320 349 338 391" fill="none" stroke="#91ff43" stroke-width="8" stroke-linecap="round"/>
</g>
<g fill="#a4ff59" filter="url(#bloom)" opacity=".28"><circle cx="320" cy="304" r="64"/></g>
<!-- The card itself contains the DANK SHIELD wordmark. Keep the emblem clean
     and legible instead of rendering a second copy of that lettering underneath. -->
<path d="M230 459h70m40 0h70" fill="none" stroke="#9fff52" stroke-width="2" stroke-linecap="round" opacity=".58"/>
</svg>