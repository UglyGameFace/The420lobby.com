name: Validate The 420 Lobby

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install website and arcade dependencies
        run: npm install --no-audit --no-fund
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Typecheck new React arcade
        run: npm run typecheck
      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check lounge.js
          node --check visual-engine.js
          node --check sesh-signal.js
          node --check sesh-loader.js
          node --check arcade-api.js
          node --check arcade-vite.config.mjs
          node --check functions/_lib/arcade-v2.mjs
          node --check scripts/build-static.mjs
          node --check arcade-app.js
          node --check arcade-games.js
          node --check shared/arcade-rules.mjs
          node --check shared/arcade-media.mjs
          find functions -type f \( -name '*.mjs' -o -name '*.js' \) -exec node --check {} \;
      - name: Site, gameplay, authentication and persistence regression tests
        run: node --test tests/*.test.mjs
      - name: Build website and new arcade
        run: npm run build
      - name: Compile Cloudflare Pages Functions without deploying
        run: npx --yes wrangler@4 pages functions build --outdir=.wrangler/functions-build
      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
      - name: Cross-browser compatibility (Chromium, Firefox, WebKit)
        run: node tests/cross-browser.mjs
      - name: Arcade authentication and gameplay browser tests
        run: node tests/arcade-browser.mjs
      - name: Spark Relay browser gameplay
        run: node tests/spark-relay-browser.mjs
      - name: Responsive browser smoke tests
        run: node tests/browser-smoke.mjs
      - name: New React arcade integration
        run: node tests/new-arcade-browser.mjs
      - name: Save browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the420lobby-previews
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
