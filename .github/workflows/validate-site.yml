name: Validate landing page

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check visual-engine.js
      - name: Static site regression tests
        run: node --test tests/site.test.mjs
      - name: Install browser smoke-test tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: node tests/browser-smoke.mjs
      - name: Save browser previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: haunted-lobby-previews
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
